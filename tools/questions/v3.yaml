# Question set v3: v2 plus wallet/chat/ssh rewritten from observed reducer output.
activities:
  - name: idle
    shape: Silent or nearly silent link; at most a few tiny keepalive packets with long idle gaps and no bursts.

  - name: unknown
    shape: Traffic is present but its shape matches none of the other described activities.

  - name: web browsing
    shape:
      what: Short bursts of many new short-lived flows to several endpoints, download-dominated with mixed packet sizes, separated by idle gaps of human reading pauses.
      not_for: one long-lived dominant flow (a download), dozens of flows active for the whole window (torrent).

  - name: ssh
    shape:
      what: One or a few long-lived balanced flows of tiny packets in a keystroke-like uneven human rhythm with tight request/response ping-pong and idle pauses; occasional short download bursts when output scrolls.
      not_for: sporadic bursts of medium packets every few seconds (wallet polling rpc), a near-silent flow with regular keepalives (chat).

  - name: software updates
    shape:
      what: A burst of a few new download-dominated flows to one or two endpoints, then sustained high-volume download of MTU-sized packets at machine-like pacing, then an abrupt stop; no human rhythm.
      not_for: bursts separated by reading pauses (web browsing), one flow for the whole time (large file download).

  - name: chat
    shape:
      what: A single long-lived flow that is almost silent; at most a single tiny burst per window, tiny packets, near-zero packet rate, long silences; the client's keepalives give it a machine-like, clock-like regular cadence.
      not_for: no flow at all (idle), a few bursts of medium packets per window (wallet polling rpc), keystroke-like cadence (ssh).

  - name: wallet polling rpc
    shape:
      what: A single flow to a single endpoint that wakes every few seconds for a short, rapid request/response exchange of medium-sized packets, so a few brief bursts per window, sporadic occupancy, low packet rate, no human rhythm, never a large upload or a sustained stream.
      not_for: tiny packets at keystroke rhythm (ssh), a flow that stays almost silent apart from keepalives (chat), several flows to several endpoints (web browsing).

  - name: torrent
    shape:
      what: A very large number of concurrent flows to many new endpoints with steady connection churn, traffic spread across many flows rather than one dominant flow, download-leaning to balanced with real upload, mixed packet sizes, continuously active.
      not_for: one dominant flow carrying nearly everything (download or upload), a handful of short flows then quiet (web browsing).

  - name: large file upload
    shape:
      what: One dominant long-lived flow, almost entirely upload, MTU-sized outbound packets back-to-back, continuously active at high volume, no human rhythm.
      not_for: traffic spread over many flows (torrent).

  - name: large file download
    shape:
      what: One dominant long-lived flow, almost entirely download, MTU-sized packets back-to-back, continuously active at very high volume, no human rhythm.
      not_for: traffic spread over many flows (torrent), many new short-lived flows to several endpoints (web browsing).

  - name: claude code
    shape: Several to many long-lived flows to one or two endpoints; per turn a brief upload-dominated burst of large packets followed by a download-leaning stream of small packets at an irregular rapid rate lasting several seconds, then a pause of several seconds; between turns only tiny keepalives on many flows.
