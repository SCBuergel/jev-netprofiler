[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netprofiler"
version = "0.1.0"
description = "Qubes OS net-qube traffic profiler: nfstream flow shape -> Jev activity guess -> Textual TUI"
requires-python = ">=3.11"
dependencies = [
    "nfstream>=6.5",
    "typesafe-sdk>=0.7",
    "textual>=0.80",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
netprofiler = "netprofiler.main:main"

[tool.setuptools]
packages = ["netprofiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
